name: Social and station integration checks

on:
  push:
    paths:
      - "src/Protocol.Core/**"
      - "src/Protocol.Determinism/**"
      - "src/Protocol.ProfessionConfig/**"
      - "src/Protocol.Social/**"
      - "tests/Protocol.Core.SmokeTests/**"
      - "tests/Protocol.Social.Tests/**"
      - "tests/Protocol.StationIntegration.Tests/**"
      - ".github/workflows/social-core.yml"
  pull_request:
    paths:
      - "src/Protocol.Core/**"
      - "src/Protocol.Determinism/**"
      - "src/Protocol.ProfessionConfig/**"
      - "src/Protocol.Social/**"
      - "tests/Protocol.Core.SmokeTests/**"
      - "tests/Protocol.Social.Tests/**"
      - "tests/Protocol.StationIntegration.Tests/**"
      - ".github/workflows/social-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  station-social:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build deterministic resident core
        run: dotnet build src/Protocol.Core/Protocol.Core.csproj --configuration Release

      - name: Run resident core invariant checks
        run: dotnet run --project tests/Protocol.Core.SmokeTests/Protocol.Core.SmokeTests.csproj --configuration Release

      - name: Build social domain
        run: dotnet build src/Protocol.Social/Protocol.Social.csproj --configuration Release

      - name: Run social domain checks
        run: dotnet run --project tests/Protocol.Social.Tests/Protocol.Social.Tests.csproj --configuration Release

      - name: Run twelve-resident social integration checks
        run: dotnet run --project tests/Protocol.StationIntegration.Tests/Protocol.StationIntegration.Tests.csproj --configuration Release
